# release.yml — build the tester download when a version tag is pushed.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Produces one GitHub Release with aiul-<tag>.zip. The zip mirrors the repo
# layout the enrol scripts expect (scripts/, packaging/scripts/, dist/), so the
# scripts run unchanged and never need Go, Docker or the backend code.
#
# Everything in it is UNSIGNED (signing is Phase 8). TESTING.md in the zip says
# what that means on each OS.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # needed to create the release

jobs:
  release:
    # macOS runner: package.sh needs Apple's pkgbuild, build.sh needs lipo.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Test
        working-directory: agent
        run: go test ./...

      - name: Build and package
        env:
          AIUL_VERSION: ${{ github.ref_name }}
        run: ./scripts/build.sh && ./scripts/package.sh

      - name: Assemble tester bundle
        env:
          TAG: ${{ github.ref_name }}
        run: |
          B="aiul-$TAG"
          mkdir -p "$B/scripts" "$B/packaging/scripts" "$B/dist"
          cp scripts/enroll-device.sh scripts/killswitch.sh scripts/killswitch-linux.sh \
             scripts/enroll-device.ps1 scripts/killswitch.ps1 "$B/scripts/"
          cp packaging/scripts/postinstall "$B/packaging/scripts/"
          # dist/aiul (the bare universal binary) is inside the .pkg already.
          cp dist/aiul-*.pkg dist/aiul-linux-amd64 dist/aiul-linux-arm64 dist/aiul.exe "$B/dist/"
          cp docs/TESTERS.md "$B/TESTING.md"
          zip -r "$B.zip" "$B" # zip keeps the executable bits

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" "aiul-$TAG.zip" --title "$TAG" --generate-notes
