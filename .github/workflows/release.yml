# release.yml — build the tester download when a version tag is pushed.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Produces one GitHub Release with aiul-macos-<tag>.zip: the unsigned .pkg, the
# enrol script and the kill switch, laid out as the scripts expect (scripts/,
# dist/), so they run unchanged and never need Go, Docker or the backend code.
# macOS only for now; Linux and Windows join when they are verified.
#
# GitHub also attaches "Source code (zip)" to every release — the whole repo,
# backend included. That cannot be turned off; the release notes point testers
# at the right file instead.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # needed to create the release

jobs:
  release:
    # macOS runner: package.sh needs Apple's pkgbuild, build.sh needs lipo.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Test
        working-directory: agent
        run: go test ./...

      - name: Build and package
        env:
          AIUL_VERSION: ${{ github.ref_name }}
        run: ./scripts/build.sh && ./scripts/package.sh

      - name: Assemble tester bundle
        env:
          TAG: ${{ github.ref_name }}
        run: |
          B="aiul-macos-$TAG"
          mkdir -p "$B/scripts" "$B/dist"
          cp scripts/enroll-device.sh scripts/killswitch.sh "$B/scripts/"
          cp dist/aiul-*.pkg "$B/dist/"
          cp docs/TESTERS.md "$B/TESTING.md"
          zip -r "$B.zip" "$B" # zip keeps the executable bits

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<EOF
          **macOS only.** Download **aiul-macos-$TAG.zip** below, unzip it and follow TESTING.md inside.

          Ignore "Source code (zip / tar.gz)": GitHub adds those to every release; they are the developer repository, not the installer.
          EOF
          gh release create "$TAG" "aiul-macos-$TAG.zip" --title "$TAG (macOS)" --notes-file notes.md
