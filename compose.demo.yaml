# The whole backend for a demo, on any machine with Docker — Mac, Windows or Linux:
#
#   docker compose -f compose.demo.yaml up -d --build
#   open http://127.0.0.1:8088/usage
#   AIUL_PORT=8098 docker compose -f compose.demo.yaml up -d --build   # 8088 taken
#
# Separate from docker-compose.yml (the developer's data services, used with
# `php artisan serve` on the host): its own project name, its own volumes, and no
# host ports except the dashboard, so both can run side by side.
#
# Remove it, data and all:  docker compose -f compose.demo.yaml down -v
name: aiul-demo

x-app: &app
  build: ./backend
  image: aiul-demo-backend
  environment:
    APP_ENV: local # DevUsersSeeder refuses anything else; this is a demo
    APP_DEBUG: "false"
    APP_URL: http://127.0.0.1:${AIUL_PORT:-8088}
    LOG_CHANNEL: stderr
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: 5432
    DB_DATABASE: aiul
    DB_USERNAME: aiul
    DB_PASSWORD: aiul_dev_password
    REDIS_CLIENT: phpredis
    REDIS_HOST: redis
    REDIS_PORT: 6379
    SESSION_DRIVER: redis
    CACHE_STORE: redis
    QUEUE_CONNECTION: redis
    AWS_ACCESS_KEY_ID: aiul
    AWS_SECRET_ACCESS_KEY: aiul_dev_password
    AWS_DEFAULT_REGION: us-east-1
    AWS_BUCKET: aiul-bodies
    AWS_ENDPOINT: http://minio:9000
    AWS_USE_PATH_STYLE_ENDPOINT: "true"
    AIUL_SEED_PASSWORD: ${AIUL_SEED_PASSWORD:-}
  volumes:
    - storage:/app/storage
  restart: unless-stopped

services:
  app:
    <<: *app
    command: serve
    ports:
      # 127.0.0.1 only: the agent on this machine posts here; nothing else can.
      - "127.0.0.1:${AIUL_PORT:-8088}:8088"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-bucket: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8088/up') === false ? 1 : 0);"]
      interval: 5s
      timeout: 5s
      retries: 30

  worker:
    <<: *app
    command: worker
    depends_on:
      app: { condition: service_healthy }

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aiul
      POSTGRES_USER: aiul
      POSTGRES_PASSWORD: aiul_dev_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiul -d aiul"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: aiul
      MINIO_ROOT_PASSWORD: aiul_dev_password
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # One-shot: the bucket prompt and answer bodies are stored in.
  minio-bucket:
    image: quay.io/minio/minio:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: ["sh", "-c", "mc alias set local http://minio:9000 aiul aiul_dev_password && mc mb --ignore-existing local/aiul-bodies"]

volumes:
  storage:
  postgres-data:
  redis-data:
  minio-data:
