# The whole backend for a demo, on any machine with Docker — Mac, Windows or Linux:
#
#   docker compose -f compose.demo.yaml up -d --build
#   open http://127.0.0.1:8088/usage
#   AIUL_PORT=8098 docker compose -f compose.demo.yaml up -d --build   # 8088 taken
#
# Separate from docker-compose.yml (the developer's data services, used with
# `php artisan serve` on the host): its own project name, its own volumes, and no
# host ports except the dashboard, so both can run side by side.
#
# Sign in as the super admin (AIUL_ADMIN_EMAIL, default admin@example.com). The
# password is printed once, in the first start's log
# (`docker compose -f compose.demo.yaml logs app`). Lost it? This prints a new one:
#   docker compose -f compose.demo.yaml exec app php artisan db:seed --class=SuperAdminSeeder --force
#
# Remove it, data and all:  docker compose -f compose.demo.yaml down -v
name: aiul-demo

x-app: &app
  build: ./backend
  image: aiul-demo-backend
  environment:
    APP_ENV: production
    APP_DEBUG: "false"
    APP_URL: http://127.0.0.1:${AIUL_PORT:-8088}
    LOG_CHANNEL: stderr
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: 5432
    DB_DATABASE: aiul
    DB_USERNAME: aiul
    DB_PASSWORD: aiul_dev_password
    REDIS_CLIENT: phpredis
    REDIS_HOST: redis
    REDIS_PORT: 6379
    SESSION_DRIVER: redis
    CACHE_STORE: redis
    QUEUE_CONNECTION: sync # nothing is queued any more
    AWS_ACCESS_KEY_ID: aiul
    AWS_SECRET_ACCESS_KEY: aiul_dev_password
    AWS_DEFAULT_REGION: us-east-1
    AWS_BUCKET: aiul-bodies
    AWS_ENDPOINT: http://minio:9000
    AWS_USE_PATH_STYLE_ENDPOINT: "true"
    AIUL_ADMIN_EMAIL: ${AIUL_ADMIN_EMAIL:-admin@example.com}
    AIUL_TENANT: ${AIUL_TENANT:-dev} # "dev": what earlier demo installs were seeded with
  volumes:
    - storage:/app/storage
  restart: unless-stopped

services:
  app:
    <<: *app
    command: serve
    ports:
      # 127.0.0.1 only: the agent on this machine posts here; nothing else can.
      - "127.0.0.1:${AIUL_PORT:-8088}:8088"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-bucket: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8088/up') === false ? 1 : 0);"]
      interval: 5s
      timeout: 5s
      retries: 30

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aiul
      POSTGRES_USER: aiul
      POSTGRES_PASSWORD: aiul_dev_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiul -d aiul"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # MinIO stopped publishing images in 2026 (quay.io/minio/minio has no
  # manifest, minio/minio on Docker Hub is denied), so a fresh machine could not
  # pull it. bitnamilegacy/minio still pulls on amd64 and arm64 and carries mc
  # and a shell. Frozen at 2025-05, never updated: fine for a demo whose MinIO
  # has no published port; a real deployment uses a managed S3 bucket.
  minio:
    image: bitnamilegacy/minio:latest
    # Bypass Bitnami's own start scripts; run the server as the image's user,
    # in the directory that user owns.
    entrypoint: ["minio", "server", "/bitnami/minio/data"]
    environment:
      MINIO_ROOT_USER: aiul
      MINIO_ROOT_PASSWORD: aiul_dev_password
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # One-shot: the bucket prompt and answer bodies are stored in.
  minio-bucket:
    image: bitnamilegacy/minio:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: ["sh", "-c", "mc alias set local http://minio:9000 aiul aiul_dev_password && mc mb --ignore-existing local/aiul-bodies"]

volumes:
  storage:
  postgres-data:
  redis-data:
  minio-data:
