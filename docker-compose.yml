# Local development data services for the AI Usage Logger backend.
# Every port is bound to 127.0.0.1 so nothing is reachable from the network.
services:
  postgres:
    image: postgres:16-alpine
    container_name: aiul-postgres
    environment:
      POSTGRES_DB: aiul
      POSTGRES_USER: aiul
      POSTGRES_PASSWORD: aiul_dev_password
    ports:
      - "127.0.0.1:5433:5432" # 5433 on the host: avoids clashing with Herd/other Postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiul -d aiul"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: aiul-redis
    ports:
      - "127.0.0.1:6380:6379" # 6380 on the host, same reason
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # MinIO is an S3-compatible object store. It stands in for AWS S3 locally, so the
  # backend can use the same S3 driver in development and production.
  minio:
    image: minio/minio:latest
    container_name: aiul-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: aiul
      MINIO_ROOT_PASSWORD: aiul_dev_password
    ports:
      - "127.0.0.1:9000:9000" # S3 API
      - "127.0.0.1:9001:9001" # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  minio-data:
